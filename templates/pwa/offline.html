{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#E63946">
  <title>Sin conexión | Servicios Automotores S.A</title>
  <link rel="icon" href="{% static 'icons/icon-192.png' %}">
  <style>
    :root { --brand: #E63946; --dark: #111; --gray: #6c757d; --bg: #f8f9fa; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--dark);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .offline-card { max-width: 420px; width: 100%; }
    .offline-card__icon {
      width: 96px; height: 96px; margin: 0 auto 1.25rem;
      display: flex; align-items: center; justify-content: center;
      background: #fff; border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }
    .offline-card__icon svg { width: 52px; height: 52px; stroke: var(--brand); }
    h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 .5rem; }
    p { color: var(--gray); line-height: 1.55; margin: 0 0 1.5rem; }
    .offline-card__actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      border: 0; border-radius: 10px; padding: .7rem 1.25rem;
      font-size: .95rem; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 6px 18px rgba(230, 57, 70, .35); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(230, 57, 70, .45); }
    .btn-ghost { background: #fff; color: var(--dark); border: 1px solid #e0e0e0; }
    .btn-ghost:hover { border-color: #bdbdbd; }
  </style>
</head>
<body>
  <div class="offline-card" role="alert">
    <div class="offline-card__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.364 5.636a9 9 0 0 0-12.728 0" />
        <path d="M15.536 8.464a5 5 0 0 0-7.072 0" />
        <path d="M12 14l-4-4a7.5 7.5 0 0 0 8 8" />
        <line x1="3" y1="3" x2="21" y2="21" />
        <path d="M4 12a9 9 0 0 0 14 4" />
      </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>No podemos cargar esta página en este momento. Verificá tu conexión a internet y probá de nuevo.</p>
    <div class="offline-card__actions">
      <button type="button" class="btn btn-primary" onclick="location.reload()">
        Reintentar
      </button>
      <a href="/" class="btn btn-ghost">Ir al inicio</a>
    </div>
  </div>
</body>
</html>
