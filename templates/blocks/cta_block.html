<section class="{{ design_classes }} cta-block">
    <div class="container text-center py-4">
        <h2 class="display-6 fw-bold mb-2 {% if on_dark %}text-white{% endif %}">{{ value.heading }}</h2>
        {% if value.text %}
            <p class="lead mb-4 {% if on_dark %}text-white opacity-90{% else %}text-secondary{% endif %}">
                {{ value.text|linebreaksbr }}
            </p>
        {% endif %}
        {% if value.cta_label and cta_href %}
            <a href="{{ cta_href }}" class="btn btn-lg px-5 mt-1 {% if on_dark %}btn-light text-brand{% else %}{{ value.cta_style }}{% endif %}">
                {{ value.cta_label }}
            </a>
        {% endif %}
    </div>
</section>
